# ============================================================
#  Construit l'image du serveur et la publie sur GHCR.
#
#  Se declenche a chaque `push` sur `main`. Environ deux minutes. Le resultat :
#      ghcr.io/guillaume999/sysb-pocketbase:latest
#      ghcr.io/guillaume999/sysb-pocketbase:<le sha du commit>
#
#  ⚠️ LE TAG `latest` EST CE QUE TIRE PORTAINER. Le tag par sha existe pour une
#  seule raison : pouvoir revenir a une image precise sans reconstruire, le jour
#  ou `latest` casse.
# ============================================================
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:   # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: read
  packages: write      # ⚠️ sans ca, le push sur ghcr.io echoue en 403

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Le moteur doit rester vert. Une image qui part avec des tests rouges,
      # c'est exactement la panne qu'on ne veut plus.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # fourni par GitHub, rien a creer

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sysb-pocketbase:latest
            ghcr.io/${{ github.repository_owner }}/sysb-pocketbase:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
